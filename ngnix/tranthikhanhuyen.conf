server {
    listen 80;
    listen [::]:80;

    server_name localhost;

    root /var/www/devops-hakthon-de006-tranthikhanhuyen/src;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cau hinh log danh rieng cho website
    access_log /var/log/nginx/tranthikhanhuyen.access.log;
    error_log /var/log/nginx/tranthikhanhuyen.error.log;
}
